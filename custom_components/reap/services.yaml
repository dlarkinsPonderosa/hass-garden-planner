add_planting:
  fields:
    crop:
      required: true
      selector:
        text:
    method:
      selector:
        select:
          options:
              - label: "Start indoors, transplant to beds"
                value: indoor_bed
              - label: "Start indoors, transplant to greenhouse"
                value: indoor_greenhouse
              - label: "Direct sow in beds"
                value: direct_bed
              - label: "Direct sow in greenhouse"
                value: direct_greenhouse
    year:
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    season:
      example: fall
      selector:
        text:
    start_date:
      selector:
        date:
    succession_days:
      selector:
        number:
          min: 0
          max: 365
          unit_of_measurement: days
          mode: box
    succession_count:
      selector:
        number:
          min: 1
          max: 200
          mode: box
    succession_until:
      selector:
        date:
    variety:
      selector:
        text:
    quantity:
      example: 6 cells
      selector:
        text:
    location:
      example: Bed 3
      selector:
        text:
    start_location:
      example: Seedling tray 1
      selector:
        text:
    bought_starts:
      selector:
        boolean:
    notes:
      selector:
        text:
          multiline: true

